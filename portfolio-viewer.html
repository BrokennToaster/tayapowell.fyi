<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Taya Powell | Project Portfolio</title>
	<meta name="robots" content="noindex, noai, noimageai">
	<link rel="shortcut icon" href="favicon.ico">
	<link rel="stylesheet" href="assets/css/portfolio-viewer.css?v=20261113-1">
	<!-- Contact data, PDF library, and project data must load before the generator. -->
	<script defer src="assets/js/contact-reveal.js?v=20261113-6"></script>
	<script defer src="assets/js/jspdf.umd.min.js"></script>
	<script defer src="assets/js/projects-data.js?v=20261112-2"></script>
	<script defer src="assets/js/portfolio-pdf.js?v=20261113-1"></script>
</head>
<body>
	<header class="viewer-bar">
		<span class="brand">Taya Powell &mdash; Project Portfolio</span>
		<nav class="viewer-actions" aria-label="Portfolio actions">
			<a id="portfolio-back" class="viewer-button" href="projects.html">Back to Projects</a>
			<button id="portfolio-share-print" class="viewer-button primary" type="button" hidden>Share / Print</button>
			<a id="portfolio-open-pdf" class="viewer-button" hidden target="_blank" rel="noopener">Open PDF / Print</a>
			<a id="portfolio-download" class="viewer-button primary" hidden download="Taya_Powell_Project_Portfolio.pdf">Download PDF</a>
		</nav>
	</header>
	<main>
		<p id="portfolio-status" role="status" aria-live="polite">Preparing your portfolio...</p>
		<!-- The direct PDF and download actions remain available if embedding is unsupported. -->
		<iframe id="portfolio-preview" title="Project portfolio PDF preview" hidden></iframe>
		<div id="portfolio-mobile-preview" aria-label="Project portfolio preview" hidden></div>
		<noscript><p>Enable JavaScript to view and download the portfolio.</p></noscript>
	</main>
</body>
</html>
